[package]
name = "gh-traffic"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Persist GitHub traffic (14-day rolling API) into Postgres so Grafana can chart it long term"
license = "MIT"

[dependencies]
postgres = "0.19"
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
