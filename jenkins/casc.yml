jenkins:
  systemMessage: "Jenkins DevOps Starter Kit — Managed by JCasC"
  numExecutors: 1
  mode: NORMAL
  disabledAdministrativeMonitors:
    - "jenkins.diagnostics.ControllerExecutorsAgents"
    - "jenkins.diagnostics.URICheckEncodingMonitor"
    - "hudson.diagnosis.ReverseProxySetupMonitor"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: "DOCKER_REGISTRY"
            value: "${DOCKER_REGISTRY:-localhost:5000}"
          - key: "PROJECTS_DIR"
            value: "${PROJECTS_DIR}"
  nodes:
    - permanent:
        name: "macmini"
        remoteFS: "${MACMINI_REMOTE_FS:-/Users/your-user/jenkins-agent}"
        numExecutors: 2
        mode: EXCLUSIVE
        labelString: "macos ios"
        retentionStrategy: "always"
        launcher:
          inbound:
            webSocket: true
    - permanent:
        name: "windows"
        remoteFS: "${WINDOWS_REMOTE_FS:-C:\\jenkins-agent}"
        numExecutors: 2
        mode: EXCLUSIVE
        labelString: "windows"
        retentionStrategy: "always"
        launcher:
          inbound:
            webSocket: true

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "macmini-ssh"
              username: "${MACMINI_USER}"
              description: "Mac Mini SSH Key"
              privateKeySource:
                directEntry:
                  privateKey: "${MACMINI_SSH_KEY}"
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "windows-ssh"
              username: "${WINDOWS_USER}"
              description: "Windows SSH Key"
              privateKeySource:
                directEntry:
                  privateKey: "${WINDOWS_SSH_KEY}"
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              description: "SonarQube Authentication Token"
              secret: "${SONARQUBE_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              username: "${GITHUB_USER:-your-user}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub PAT for SCM polling"
          # --- Android / Play signing (backported from live 2026-08). Values are
          # supplied via env at deploy — never in the repo. `file` creds take the
          # base64 of the file in *_B64. See .env.example. ---
          - file:
              scope: GLOBAL
              id: "android-keystore"
              fileName: "release.keystore"
              secretBytes: "${ANDROID_KEYSTORE_B64}"
              description: "Android release keystore (base64 in ANDROID_KEYSTORE_B64)"
          - string:
              scope: GLOBAL
              id: "android-key-alias"
              secret: "${ANDROID_KEY_ALIAS}"
              description: "Android signing key alias"
          - string:
              scope: GLOBAL
              id: "android-key-password"
              secret: "${ANDROID_KEY_PASSWORD}"
              description: "Android signing key password"
          - string:
              scope: GLOBAL
              id: "android-store-password"
              secret: "${ANDROID_STORE_PASSWORD}"
              description: "Android keystore store password"
          - file:
              scope: GLOBAL
              id: "google-play-key"
              fileName: "google-play-key.json"
              secretBytes: "${GOOGLE_PLAY_KEY_B64}"
              description: "Google Play service-account JSON key (base64 in GOOGLE_PLAY_KEY_B64)"

unclassified:
  cspConfiguration:
    enforce: true
  location:
    url: "${JENKINS_URL:-https://your-domain.com/jenkins/}"
  gitHubPluginConfig:
    # Backported from live 2026-08 — was set in the UI, absent from IaC, so a fresh
    # deploy left the GitHub webhook URL unset. Derived from the same JENKINS_URL env.
    hookUrl: "${JENKINS_URL:-https://your-domain.com/jenkins/}github-webhook/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "${SONAR_HOST_URL:-http://sonarqube:9000/sonarqube}"
        credentialsId: "sonarqube-token"

security:
  scriptApproval:
    # Backported from live 2026-08 — approved in the UI, absent from IaC, so a fresh
    # deploy blocks pipelines using these until re-approved by hand.
    approvedSignatures:
      - "method hudson.model.Run getLog int"
      - "method org.jenkinsci.plugins.workflow.support.steps.build.RunWrapper getRawBuild"
    approvedScriptHashes:
      - "SHA512:f68d11bc5ef08114dd0490e5113e1b9439385cf1044871b5606ac3f0bd8938b8cfd866b8278aee95d0c1a983d17d8bef78ff9015b9c1cb2a968cba2d37919cee"
